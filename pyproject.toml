[build-system]
# >=77 for PEP 639: the SPDX `license` string and the [project] `license-files`
# key below are both rejected as unknown fields by older setuptools.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plexora"
version = "0.0.27"
description = "OpenSeadragon-based cellular image viewing and analysis tool."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Not an SPDX-listed license, so it is carried as a LicenseRef- custom
# identifier (PEP 639). Free for academic/noncommercial use, no distribution of
# modified versions, plugins explicitly carved out; commercial use needs a
# separate license. Full terms in LICENSE, which license-files ships into the
# wheel and sdist.
license = "LicenseRef-Plexora-Academic-1.0"
license-files = ["LICENSE"]
dependencies = [
    # Reading images from a web address (server/utils/remote_store.py):
    # fsspec is zarr's route to anything that is not a local directory,
    # aiohttp carries https://, and s3fs carries s3://. Declared rather than
    # leaned on transitively through spatialdata and dask, because https and
    # anonymous S3 are the zero-configuration path -- IDR, public buckets --
    # and must not depend on what some other package happens to pull in.
    "aiohttp>=3.9",
    "anndata>=0.10",
    # Verifies licence certificates (plexora/licensing/certificate.py): one
    # Ed25519 signature check, imported only when a Paid feature or the licence
    # status is asked for, never on a Free path. The same library SCIMAP Pro
    # verifies with; binary wheels for every platform Plexora supports.
    "cryptography>=42",
    "Flask>=3.1",
    "fsspec>=2024.12",
    # Declared rather than leaned on transitively: gating reads and writes
    # .h5ad through both directly at module scope
    # (plugins/gating/server/anndata_gates.py), so an anndata release that
    # dropped either would break the plugin at import, not at use.
    "h5py>=3.16.0",
    "imagecodecs",
    "itsdangerous>=2.2",
    "Jinja2>=3.1",
    # Compiled kernels for the few analysis loops numpy cannot vectorise --
    # neighbour counts over millions of cells, label-mask boxes and outlines
    # (plexora/server/utils/jit.py). Every kernel has an identity fallback, so
    # an environment without it is slower, not broken.
    "numba>=0.61",
    "numpy>=2.0",
    "ome-types>=0.6.3",
    # Draws a run's cell boundary polygons into the label mask the viewer
    # serves (server/utils/boundary_mask.py). Core rather than an extra: a
    # Xenium run states its segmentation as polygons, and a sample whose cells
    # cannot be outlined, filled or coloured is not a partial import, it is a
    # different product. Measured against the two rasterizers already here on
    # a 247,636-cell run -- Pillow 1.6x slower, scikit-image 36x -- and the
    # difference is minutes of import time on a whole-slide mask. `headless`
    # because nothing here opens a window, and the GUI build drags Qt and GL
    # onto every server that installs it.
    "opencv-python-headless>=5.0.0.93",
    # Reads the .xlsx/.xlsm side of the channel-names upload
    # (server/utils/channel_file.py). A panel design lives in a spreadsheet far
    # more often than in a CSV, and "export it as CSV first" is a step at the
    # exact moment the user is trying to fix channel names that are already
    # wrong. Pure Python, no build step; still imported lazily, so an
    # environment missing it refuses Excel with a readable sentence instead of
    # failing to start.
    "openpyxl>=3.1",
    # Magic select (plexora/vision/): the ROI and QC panels' click-to-outline
    # tool and the QC agent's snug tracer run a small segmentation model on
    # ONNX Runtime. Core rather than an extra because the tool sets itself up
    # automatically the first time it is armed -- a pip step at that moment
    # would make "automatic" a lie. The ~44 MB of weights are NOT in the
    # wheel; they are fetched once, sha256-verified, on first use. The default
    # wheel runs on CPU and, on macOS, CoreML; onnxruntime-gpu (same import
    # name) adds CUDA and is picked up when installed instead. No torch.
    # The floor is low on purpose: pip takes the newest release with a wheel
    # for the machine (1.17 still has macOS 11 universal2 wheels). Linux needs
    # glibc 2.27 or newer for any release on Python 3.12/3.13 -- the one
    # platform this narrows.
    "onnxruntime>=1.17,<2",
    "orjson>=3.11",
    # Not a second dataframe library alongside polars -- it is the AnnData
    # interop boundary (see h5py above). Polars stays the one Plexora computes
    # in; pandas only crosses in and out of .h5ad.
    "pandas>=3.0.5",
    "Pillow>=10.4",
    # Resolves the per-user data and config directories (plexora/paths.py).
    # Replaces appdirs, which is unmaintained; platformdirs is its successor
    # and was already present transitively.
    "platformdirs>=4",
    "polars>=1.43",
    "pydantic>=2.13,<2.14",
    # Vector PDF export from Figure Builder. Core rather than an extra: a
    # publication figure tool whose publication format is a separate install is
    # a tool that fails at the last step. export.py still imports it lazily and
    # still degrades to PNG/TIFF with a readable message, because that guard
    # costs nothing and covers an environment where it went missing.
    "reportlab>=5.0.1",
    "s3fs>=2024.12",
    "scikit-image",
    "scikit-learn>=1.9",
    "scipy",
    # Core ROI cell assignment, not a spatialdata detail: the STRtree
    # containment query in plugins/roi/server/mapping.py runs for every
    # project, whatever format it was imported from.
    "shapely>=2.1.2",
    "spatialdata>=0.8.0",
    # Called at import of the package itself (plexora/__init__.py), to cap the
    # BLAS thread pool before sklearn deadlocks in a threaded server.
    "threadpoolctl>=3.6.0",
    "tifffile>=2026.7.31",
    # The primary's HTTP client for talking to data nodes
    # (server/providers/http.py). Declared rather than leaned on transitively
    # through requests -- which Plexora does not depend on -- because the
    # connection pooling is the point: a proxied tile request must not open a
    # TCP connection per tile.
    "urllib3>=2.0",
    "waitress",
    "Werkzeug>=3.1",
    "zarr>=3",
]

[project.optional-dependencies]
jupyter = [
    "ipython",
    "jupyter-server-proxy",
]
dev = [
    "pytest",
    "pytest-randomly>=4.1.0",
]
# Transcript-scale point data: one-column-at-a-time reads out of a 1-6 GB
# parquet, which is the difference between working on a laptop and not. pandas
# already pulls pyarrow into every environment this has been measured in, so
# this extra normally installs nothing -- it exists because that dependency is
# TRANSITIVE rather than declared, and `TranscriptDependencyMissing` names this
# extra when the import fails, which it must therefore be possible to install.
spatial = [
    "pyarrow>=14",
]
# Google Cloud Storage (gs://) and Azure (az://, abfs://) for images read from
# a web address. An extra rather than core because each pulls in its cloud's
# SDK; https:// and s3:// need nothing here. `RemoteSupportMissing` names this
# extra when a gs:// or az:// address is opened without it.
remote = [
    "gcsfs>=2024.12",
    "adlfs>=2024.12",
    # A DICOM slide streamed from a web address: wsidicom reads frames through
    # file objects that dicom_wsi.py builds over the chunk cache, so every
    # frame is fetched once. 0.35 is the first release whose WsiDicomIO /
    # WsiDicomFileSource constructors take an open stream. universal-pathlib
    # is imported directly for the path wsidicom records against each stream.
    # `DicomSupportMissingRemote` names this extra.
    "wsidicom>=0.35",
    "pydicom>=3",
    "universal-pathlib>=0.2",
]
# Whole-slide containers tifffile cannot open. One extra rather than two
# because it is one answer to one question -- "I have slides, not TIFFs" -- and
# splitting it would make somebody who has both install twice. Every reader
# behind it is imported lazily and every one of them names this extra when it
# is missing, so an environment without it refuses a slide with an install line
# instead of letting an ImportError reach the browser.
wsi = [
    # .mrxs is a directory of tiles rather than a TIFF, so nothing else in the
    # tree can open it; .svs/.ndpi/.scn are TIFFs underneath and are read
    # without any of this. The binary half ships the C library as a wheel, and
    # where no wheel exists brightfield.py's BrightfieldSupportMissing names
    # the system package instead.
    "openslide-python>=1.3",
    "openslide-bin>=4.0",
    # DICOM WSI, where a slide is a collection of instances rather than a file.
    # wsidicom reassembles one from its metadata -- pyramid levels, optical
    # paths, concatenations, label and overview images -- and reads tiles per
    # optical path, which is what makes a 36-marker slide render as 36 channels
    # instead of a flattened thumbnail. OpenSlide 4 can also open DICOM, and is
    # deliberately not used for it: it flattens the slide to RGB, which is the
    # one thing a multiplex viewer must not do.
    "wsidicom>=0.35",
    # Declared explicitly rather than leaned on through wsidicom, by the same
    # rule as h5py above: dicom_wsi.py imports pydicom directly to read headers
    # during discovery and detection, so a wsidicom release that swapped it out
    # would break slide assembly rather than merely slide reading.
    "pydicom>=3",
]
# External AI agents (Claude Code, Codex, Cursor) over the Model Context
# Protocol: `plexora mcp serve`. The SDK and the skill manifest's YAML reader,
# and nothing else -- Plexora ships no model-provider code; agents bring their
# own model. Imported lazily, and `plexora mcp` names this extra when missing.
ai = [
    "mcp>=2.2,<3",
    "pyyaml>=6",
]
# The shared protocol SCIMAP Pro and other spatial tools speak to Plexora
# (spatialbridge): the bridge_* capabilities, the HTTP capability endpoints'
# descriptors and the shared workspace. Optional because Plexora works alone;
# without it the bridge capabilities answer `capability_unavailable` with this
# install line. Imported lazily -- never at `import plexora`.
bridge = [
    "spatialbridge>=0.1,<0.2",
]

[project.scripts]
plexora = "plexora.cli:main"
plexora-server = "plexora.server_cli:main"

# Third-party plugins advertise themselves here. Plexora's own plugins are
# also found by scanning the bundled plugins package, so working from source
# does not require reinstalling after every edit.
[project.entry-points."plexora.plugins"]
cell_explorer = "plexora.plugins.cell_explorer:PLUGIN"
figure_builder = "plexora.plugins.figure_builder:PLUGIN"
gating = "plexora.plugins.gating:PLUGIN"
qc = "plexora.plugins.qc:PLUGIN"
roi = "plexora.plugins.roi:PLUGIN"

[project.entry-points.jupyter_serverproxy_servers]
plexora = "plexora.proxy:setup_plexora"

[tool.setuptools.packages.find]
include = ["plexora*"]
# Namespace discovery is ON (the default) and must stay on: plexora/server and
# its models/routes/utils subpackages have no __init__.py, so turning it off
# drops the entire server from the wheel while still producing a build that
# looks successful. The cost of leaving it on is that discovery also sweeps up
# any directory holding a .py file -- client/node_modules ships a vendored
# flatted/python/flatted.py -- hence excluding by path rather than by switch.
exclude = ["plexora.client*", "plexora.plugins.*.tests*"]

[tool.setuptools.package-data]
# ** throughout, deliberately: "client/templates/*.html" was single-level and
# never matched client/templates/partials/, which only shipped because
# MANIFEST.in happened to cover it. Plugin authors copying these globs should
# not inherit that trap.
plexora = [
    "client/templates/**/*.html",
    "client/dist/*",
    "client/src/css/*.css",
    "client/src/img/*",
    "client/src/js/**/*.js",
    "client/src/shaders/*.glsl",
    "client/external/**/*",
    # Bundled plugins ship their own templates and client assets.
    "plugins/*/templates/**/*.html",
    "plugins/*/static/**/*",
    # The agents' scientific skills and their manifest (plexora/ai).
    "ai/skill_manifest.yaml",
    "ai/skills/**/*.md",
    # The AI tasks a gateway call names (plexora/ai/tasks.py).
    "ai/tasks.yaml",
    # The shipped marker vocabulary automatic gating grounds its biology in.
    "ai/knowledge/*.yaml",
]

# Development: the protocol library is a sibling checkout until it is
# published. Ignored by pip; only uv reads this table.
[tool.uv.sources]
spatialbridge = { path = "../spatialbridge", editable = true }

[tool.pytest.ini_options]
# Bundled plugins keep their tests beside their code, so a plugin is one
# self-contained directory. Core tests stay in tests/.
testpaths = ["tests", "plexora/plugins"]

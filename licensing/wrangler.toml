# Plexora licence service: /v1 (the Plexora client), /portal (licence
# holders), /admin (us), /healthz, and one daily maintenance cron.
#
# Fully independent of the telemetry Worker in ../backend: no shared binding,
# database or bucket. Telemetry may observe licensing coarsely; licensing never
# depends on telemetry. Both share one Cloudflare account, so the D1 and R2
# numbers below are shares of the account-wide free tier. See README.md.
name = "plexora-licensing"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Required by @cloudflare/vitest-pool-workers; nothing in src/ imports a node
# builtin.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# One host, as a Workers custom domain: Cloudflare creates its DNS record and
# certificate on deploy. PUBLIC_BASE_URL below and
# plexora/licensing/store.py DEFAULT_SERVER must match it.
routes = [{ pattern = "license.plexoraapp.com", custom_domain = true }]

[[d1_databases]]
binding = "LICENSE_DB"
database_name = "plexora-license"
# Paste the id printed by `wrangler d1 create plexora-license`.
database_id = "fdf1098c-514e-4e6a-8f00-d52aa44a89ee"

[[r2_buckets]]
# Daily gzipped JSON backups of D1 (never the sessions table). Standard class.
binding = "BACKUPS"
bucket_name = "plexora-license-backups"

[triggers]
# One daily run: expiry, reminders, idle release, pruning, signals, backup.
crons = ["30 3 * * *"]

# Every value is a string, parsed by src/env.ts knob(). Changing one needs a
# redeploy, never a code change.
[vars]
# Only values that differ from the code. Every numeric knob (certificate and
# grace days, rate limits, retention, the AI gateway's holds, retries and
# circuits) has its default in src/env.ts DEFAULTS, which knob() falls back
# to; set one here (and in [env.staging.vars]) to override it. Workers Free
# allows 64 variables per Worker, secrets included, so defaults are not
# repeated here.
PUBLIC_BASE_URL = "https://license.plexoraapp.com"
# The public halves of the signing keys, so a retired kid stays verifiable
# after its private key is destroyed. Printed by tools/generate_keys.py.
PUBLIC_KEYS_JSON = '{"px1":"jQttSzXwG5urWuMpQxXKqFMwKuKEBv3XiqfuvvtuK-4","px2":"RaXE_ZCds7Wlds55oNLIesOozWA-T4N_0SpmCl_QC30"}'
# The slot that signs new certificates: px1 or px2.
ACTIVE_KID = "px1"
# Cloudflare Access for /admin (the account's Zero Trust team, shared with
# SCIMAP Pro). Both set: the Worker verifies the Access JWT. ACCESS_AUD is the
# Plexora admin application's own audience tag. ADMIN_TOKEN stays the
# break-glass way in.
ACCESS_TEAM_DOMAIN = "dawn-night-f2f0.cloudflareaccess.com"
ACCESS_AUD = "c6c97d7452b5ce2fff549e300cc295f4059b8b2f957d810d5088cc7abfa0b1dd"
MAIL_FROM = "Plexora <licensing@plexoraapp.com>"
SUPPORT_EMAIL = "support@plexoraapp.com"
# Plexora AI. 1: a route may name ANY catalogued model, benched or not (the
# row is flagged unbenched = 1 and the admin AI page shows it); 0 brings back
# the routing-bench gate for all but Anthropic direct. The route tests pin 0
# in vitest.workers.config.ts, so the gate itself stays tested.
AI_ALLOW_UNBENCHED_ROUTES = "1"
# Monthly included AI credit per active seat, micro-USD: 2000 credits ($20 of
# metered use). A run reserves its quote up front, so without credit or an
# allowance a seat cannot start one even on a $0 model. Revisit before
# routing to a paid model: it is real spend per seat then.
AI_ALLOWANCE_PER_SEAT_MICRO = "20000000"

# Secrets, set with `wrangler secret put <NAME>`; never in this file or the repo.
#   SIGNING_KEY_PX1   base64url Ed25519 seed for kid px1 (tools/generate_keys.py)
#   SIGNING_KEY_PX2   the standby slot (optional until a rotation)
#   FP_PEPPER         pepper for environment bindings and trial fingerprints
#   IP_HASH_KEY       pepper for the IP hashes rate limits and signals use
#   ADMIN_TOKEN       admin bearer token
#   SESSION_KEY       portal and admin cookie HMAC key
#   KEY_VAULT_KEY     base64 AES-256 key to let the portal re-display seat keys (optional)
#   RESEND_API_KEY    email delivery (optional; without it mail is logged, not sent)
#   ANTHROPIC_API_KEY Plexora's own provider key for the AI gateway (optional;
#                     without it every /v1/ai/messages call fails upstream)
#   AI_USER_PEPPER    pepper for the end-user id sent to the provider
#   OPENAI_API_KEY, OPENROUTER_API_KEY, ORCAROUTER_API_KEY, SAYGM_API_KEY
#                     further providers the AI route table may name (optional;
#                     a route whose provider has no key is skipped)

# -- staging ----------------------------------------------------------------------
#
# `wrangler ... --env staging`: a second Worker, plexora-licensing-staging, with
# its own D1, R2 bucket, secrets and signing key, on workers.dev only. Nothing
# here touches production. tools/ai_staging.py sets it up and seeds it;
# docs/internal/AI_DEPLOY.md has the steps.
#
# wrangler inherits `routes` and `triggers` into an environment but NOT
# `vars`, D1 or R2. So `routes = []` below is what keeps staging off
# license.plexoraapp.com, and every [vars] entry is repeated in
# [env.staging.vars] (tests/test_licensing_staging_config.py checks the two
# lists match, apart from the keys it names as differing on purpose).
[env.staging]
name = "plexora-licensing-staging"
workers_dev = true
routes = []

[[env.staging.d1_databases]]
binding = "LICENSE_DB"
database_name = "plexora-license-staging"
# Written by `python tools/ai_staging.py create` (wrangler d1 create).
database_id = "5d2d781b-95d8-48f3-932f-cb496e3b34cd"

[[env.staging.r2_buckets]]
binding = "BACKUPS"
bucket_name = "plexora-license-staging-backups"

[env.staging.vars]
# Rewritten by `python tools/ai_staging.py deploy` to the workers.dev URL the
# deploy prints (the account's subdomain). It only shapes links in mail,
# which staging logs.
PUBLIC_BASE_URL = "https://plexora-licensing-staging.ajitjohnsonn-n.workers.dev"
# Staging's OWN key, kid pxs1 (private half: ~/.plexora-staging/, never the
# repo). No Plexora build trusts pxs1, so a staging certificate can never
# unlock a real install; tools/ai_e2e.py --remote trusts it in-process only.
PUBLIC_KEYS_JSON = '{"pxs1":"AoZ7IUeEPHM9Mc0qQSqpDv7QItruCjexVC0I4B9EZSk"}'
ACTIVE_KID = "pxs1"
# Empty on purpose: there is no Access application in front of workers.dev,
# so /admin is ADMIN_TOKEN (bearer, or /admin/login) only.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
MAIL_FROM = "Plexora staging <licensing@plexoraapp.com>"
SUPPORT_EMAIL = "support@plexoraapp.com"
# As production: any catalogued model, and the monthly allowance.
AI_ALLOW_UNBENCHED_ROUTES = "1"
AI_ALLOWANCE_PER_SEAT_MICRO = "20000000"

# Staging secrets (`wrangler secret put <NAME> --env staging`, or
# `python tools/ai_staging.py secrets`). Fresh values, NEVER production's:
#   SIGNING_KEY_PXS1   from ~/.plexora-staging/signing-keys.json
#   FP_PEPPER, IP_HASH_KEY, SESSION_KEY, AI_USER_PEPPER, ADMIN_TOKEN   random
#   OPENROUTER_API_KEY (and any of ANTHROPIC_API_KEY, OPENAI_API_KEY,
#   ORCAROUTER_API_KEY, SAYGM_API_KEY the staging route table names)
# Left unset on purpose: SIGNING_KEY_PX1/PX2 (production's), RESEND_API_KEY
# (staging mail is logged, never sent), KEY_VAULT_KEY.

# Second names for one object. The key is the alias, the value the name the
# page is filed under; the page lists the alias. Re-exports of
# plexora.api.plugin names from plexora.api are recognised automatically.
aliases:
  plexora.api.Dataset: plexora.api.ProjectData
  plexora.api.dataset: plexora.api.project_data

# Public names that are deliberately not documented, each with the reason.
excluded:
  plexora.api.plugin.UNRELEASED_KEYS: Validation table behind normalize_shortcut; its effect is documented there.
  plexora.api.plugin.UNRELEASED_SHIFT_KEYS: Validation table behind normalize_shortcut; its effect is documented there.
  plexora.api.plugin.COORDINATES_KEY: Same value as plexora.api.manifest.COORDINATES_KEY, kept for the host.
  plexora.api.manifest.manifest: Returns the raw status map the host serves; summary() is the plugin-facing view.
  plexora.api.manifest.layers: Host helper for the setup prompt; use plexora.api.layers.
  plexora.api.manifest.never_confirmed: Host helper for the setup prompt.
  plexora.api.manifest.LABELS: Display strings owned by the host UI.
  plexora.api.manifest.GIVEN_KEYS: Host bookkeeping for the setup prompt.
  plexora.api.manifest.COORDINATES_KEY: Host bookkeeping for the setup prompt.

# "How is this different?" boxes, shown on the page of every symbol named.
compare:
  - title: import_sample or create_project?
    symbols: [plexora.import_sample, plexora.create_project]
    body: |
      | | `import_sample` | `create_project` |
      |---|---|---|
      | You pass | Files or a run folder | An image, with every other file named by role |
      | Plexora works out | What each file is (image, mask, table, transcripts) | Nothing: you said what each file is |
      | Best for | Xenium, Visium and Visium HD output folders; a folder of files | Scripts that must not guess; files with unusual names |
      | Returns | The project name | The project name |

      Both create the same kind of project. Use `import_sample` when the files
      explain themselves, and `create_project` when you want to be explicit.
  - title: create_project or register_datasource?
    symbols: [plexora.create_project, plexora.register_datasource]
    body: |
      `create_project` needs only an image and lets you answer the remaining
      questions later with `configure_project`. `register_datasource` is the
      older, all-at-once form: the image, the table and the coordinate columns
      in one call. New code should use `create_project`; `register_datasource`
      stays for scripts that already use it.
  - title: create_dataset or create_project?
    symbols: [plexora.create_dataset, plexora.create_project]
    body: |
      A **project** is one sample: one image with its mask, table and layers.
      A **dataset** is a folder of projects that belong together, such as a
      cohort or a TMA series. `create_dataset` can register images as
      projects while it creates the dataset, or collect projects that
      already exist.
  - title: dataset or Dataset?
    symbols: [plexora.dataset, plexora.Dataset]
    body: |
      `plexora.dataset(name)` is the function that looks a dataset up.
      `plexora.Dataset` is the class of what it returns. You rarely construct
      a `Dataset` yourself.
  - title: project_data or dataset?
    symbols: [plexora.api.project_data]
    body: |
      `plexora.api.dataset` is the same function under its older name. A
      dataset in Plexora is now a folder of projects (`plexora.create_dataset`),
      so plugin code should call `project_data`.

# Command-line reference (tools/docs/cli_api.py).
cli:
  include: ["", where, config, connect, node, dataset, project]
  exclude:
    mcp: Agent integration, not part of the public documentation.
    ai: Agent integration, not part of the public documentation.
    telemetry: Usage data settings, documented in the repository, not on the site.
    license: Commercial licensing, not part of the public documentation.
  # Options shown with an "internal" badge: used by Plexora itself.
  internal:
    "": [--desktop]

# Notes appended to rows of the supported-formats table (formats.py).
format_notes:
  ".svs": Aperio whole-slide image, read as brightfield.
  ".ndpi": Hamamatsu whole-slide image, read as brightfield.
  ".scn": Leica whole-slide image, read as brightfield.
  ".bif": Roche Ventana whole-slide image, read as brightfield.
  ".mrxs": 3DHISTECH whole-slide image. Needs the `wsi` extra (`pip install "plexora[wsi]"`).
  ".svslide": Sakura whole-slide image. Needs the `wsi` extra.
  ".dcm": DICOM whole-slide image (a folder of .dcm files), read with wsidicom.
  ".zarr": OME-Zarr image, or a SpatialData store when it contains tables.
  ".h5ad": AnnData. Coordinates from `obsm["spatial"]` or two `obs` columns.
  ".parquet": Parquet cell table.
  ".csv": Comma-separated cell table.
  ".tsv": Tab-separated cell table.
  ".txt": Tab- or comma-separated cell table.
  ".png": Single-plane RGB or grayscale image.
  ".jpg": Single-plane RGB or grayscale image.
  ".jpeg": Single-plane RGB or grayscale image.
  ".tif": TIFF or OME-TIFF image, or a label mask.
  ".tiff": TIFF or OME-TIFF image, or a label mask.
  ".qptiff": Akoya PhenoImager (Vectra/Polaris) multiplex image.

# Folders and stores, which have no single extension (formats.py).
format_folders:
  - name: OME-Zarr (`.zarr` folder)
    reads: A multiscale image, local or at an `https://` or `s3://` address.
    guide: /docs/modalities/multiplexed-imaging
    guide_title: Multiplexed imaging
  - name: SpatialData (`.zarr` folder with `tables/`)
    reads: Images, labels, points and a cell table from one store.
    guide: /docs/modalities/spatialdata
    guide_title: SpatialData
  - name: Xenium output folder
    reads: Morphology image, cell and nucleus boundaries, cells, transcripts.
    guide: /docs/modalities/xenium
    guide_title: Xenium
  - name: Visium output folder (`outs/`)
    reads: Tissue image, spot positions and the spot-by-gene matrix.
    guide: /docs/modalities/visium
    guide_title: Visium
  - name: Visium HD output folder (`outs/`)
    reads: Tissue image and the 2, 8 and 16 µm bin matrices.
    guide: /docs/modalities/visium-hd
    guide_title: Visium HD
  - name: DICOM whole-slide folder
    reads: A pyramidal brightfield slide stored as DICOM instances.
    guide: /docs/modalities/brightfield-wsi
    guide_title: Brightfield whole-slide images

# Formats recognised but not imported (formats.py).
format_unsupported:
  - name: NanoString CosMx output
    status: Not supported. Export a cell table and image and import them as files.
  - name: Vizgen MERSCOPE output
    status: Not supported. Export a cell table and image and import them as files.
  - name: Feather tables
    status: Not supported. Convert to Parquet or CSV.
  - name: GeoJSON shapes
    status: Recorded on import but not drawn.
  - name: Xenium cell-feature matrix
    status: Recorded on import but not read; the cell table supplies per-cell values.


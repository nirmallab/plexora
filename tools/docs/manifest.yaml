# What the generated reference documents, and how.
#
# Every public name Plexora exposes -- `plexora.<name>` (plexora._PUBLIC_API
# plus `view`), `plexora.api.__all__`, the public names of
# `plexora.api.plugin`, and the members of modules re-exported by
# `plexora.api` -- must appear here exactly once: in a category, under
# `aliases`, as a module member, or under `excluded` with a reason.
# tests/test_docs_coverage.py enforces that, so adding a public function
# without deciding where it is documented fails CI.
#
# Prose does not live here. A symbol's explanation, parameters, examples and
# notes are its docstring; this file only says where the page goes and what
# it links to. Run `python tools/docs/sync_docs.py generate` after editing.

docstrings:
  style: google
  # {symbol, code, param (optional), reason}: a diagnostic that is accepted.
  waivers: []
  # Functions whose keyword arguments are open-ended and documented as a
  # group in prose rather than one Args entry each.
  allow_partial: []
  # Symbols whose docstrings have not been rewritten yet. Their docstring
  # test is xfail(strict=True): fixing one makes the test XPASS and fail
  # until the name is removed from this list.
  backlog: []

sections:

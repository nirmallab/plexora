# Every PLEXORA_* name that appears in Plexora's source, classified.
#
# `public` variables are documented on the site
# (reference/environment-variables); `internal` ones are set by Plexora for
# itself, by its tests, or belong to areas the public docs leave out
# (telemetry, licensing, agents). `ignore` lists names that look like
# environment variables but are not (JavaScript constants, Flask config keys,
# shell heredoc markers).
#
# tests/test_docs_envvars.py scans plexora/**/*.py, the client's JS and
# templates, the desktop shell's Rust sources, run.py and the Dockerfile, and
# fails when a name is found that is not listed here, or listed and no longer
# found. Adding an environment variable therefore means adding it here.

public:
  - name: PLEXORA_DATA_PATH
    group: Data
    description: The data directory, overriding everything else. Projects, datasets and settings for this session live under it.
    example: /scratch/me/plexora
  - name: PLEXORA_DATA_PATH_DEFAULT
    group: Data
    description: A data directory to use only if this account has not chosen one. A directory recorded with `plexora config set data-dir` wins over it. `plexora connect` sets it on the remote host from a saved connection.
  - name: PLEXORA_SHARED_PATH
    group: Data
    description: Extra data directories whose projects are listed alongside your own, separated by `:` (macOS, Linux) or `;` (Windows). The same as `plexora config set shared-dirs`.
    example: /lab/shared/plexora
  - name: PLEXORA_MASK_OUTPUT
    group: Data
    description: Where a converted segmentation mask is written. `beside` (the default) writes it next to the original mask so other projects and data nodes reuse it; `project` writes it under the project's own directory.
    default: beside
  - name: PLEXORA_REMOTE_CACHE_BYTES
    group: Data
    description: How much disk, in bytes, the cache of images read from web addresses may use. At least 1 GB. The same as `plexora config set remote-cache-gb`.
    default: "10737418240 (10 GB)"
  - name: PLEXORA_HOST
    group: Server
    description: The address `plexora` binds to. Use `0.0.0.0` to accept connections from other machines (for example inside Docker).
    default: 127.0.0.1
  - name: PLEXORA_BASE_URL
    group: Server
    description: A URL prefix to serve under, when Plexora sits behind a proxy that forwards a sub-path (JupyterHub, Open OnDemand). Usually detected; set it only when detection fails.
    example: /user/me/proxy/8000
  - name: PLEXORA_PLUGINS
    group: Server
    description: Comma-separated plugin names to activate. Unset activates every installed plugin; an empty string starts the core viewer only. The same as `plexora --plugins`.
    example: roi,cell_explorer
  - name: PLEXORA_AUTH_TOKEN
    group: Server
    description: When set, the viewer only opens from a URL carrying `?token=<value>`. `plexora --ood` and the desktop app set it for you.
  - name: PLEXORA_LOG_LEVEL
    group: Server
    description: Python logging level for the server (`DEBUG`, `INFO`, `WARNING`, `ERROR`).
    default: WARNING
  - name: PLEXORA_DOCKER
    group: Server
    description: Set to `1` by the Docker image. Tells the import page to show paths as the container sees them.
  - name: PLEXORA_NODE_HOST
    group: Data nodes
    description: Default for `plexora node serve --host`.
    default: 127.0.0.1
  - name: PLEXORA_NODE_TOKEN
    group: Data nodes
    description: Default for `plexora node serve --token`, the shared secret a viewer authenticates with.
  - name: PLEXORA_FEATURE_CACHE_MB
    group: Performance
    description: Memory, in megabytes, for caching feature columns read on demand from wide tables.
    default: "512"
  - name: PLEXORA_WIDE_FEATURE_LIMIT
    group: Performance
    description: Tables with more feature columns than this are read column by column on demand instead of loaded whole (whole-transcriptome matrices).
    default: "1024"
  - name: PLEXORA_MASK_FULL_READ_MAX_BYTES
    group: Performance
    description: Largest mask, in bytes, read into memory in one go when converting it. Larger masks are streamed tile by tile, which uses less memory but is slower on network drives.
    default: "8589934592 (8 GB)"
  - name: PLEXORA_NO_NUMBA
    group: Performance
    description: Set to `1` to skip the compiled numba kernels and use the pure-Python fallbacks. Slower; useful when numba fails to load.
  - name: PLEXORA_SEGMENT_MODEL_DIR
    group: Magic select
    description: Directory magic select's model files are read from and downloaded to. For an offline machine, copy the two files here (or run `plexora ai segment install` once where there is a network) and nothing is fetched. The same as `plexora config set segment-model-dir`.
    default: "<data directory>/.models/segment"
  - name: PLEXORA_SEGMENT
    group: Magic select
    description: Set to `0` to switch magic select off everywhere -- the ROI and QC panels, and the QC agent's snug outlines. Nothing is downloaded and every outline is traced the classical way.
  - name: PLEXORA_SEGMENT_DEVICE
    group: Magic select
    description: "`auto` uses a GPU when this machine's ONNX Runtime offers one (CUDA, ROCm, DirectML or Apple's CoreML) and falls back to the CPU; `cpu` never uses one; `gpu` refuses to run without one. The optional through-planes model (SAM 2.1, the `volume3d` extra) uses CUDA when there is one and the CPU otherwise -- never Apple's GPU, where its tracking comes out wrong; `mps` forces it there, to check a newer PyTorch."
    default: auto
  - name: PLEXORA_SEGMENT_MODEL_URL
    group: Magic select
    description: Fetch magic select's model files from this address instead of Plexora's release (a mirror inside a firewalled site). The files are checked against the same checksums either way.
  - name: PLEXORA_SEGMENT3D_MODEL_URL
    group: Magic select
    description: Fetch the optional through-planes model (SAM 2.1, used when the `volume3d` extra is installed) from this address instead of Meta's release. Checked against the same checksum either way.
  - name: PLEXORA_VOLUME_BRICKS
    group: Z-stacks
    description: Set to `0` to never copy a stack into 3-D bricks. A large stack stored plane by plane is otherwise copied in the background, its zoomed-out levels only, so projections, sections and the 3-D view read across planes quickly.
  - name: PLEXORA_VOLUME_LEVEL_BUDGET
    group: Z-stacks
    description: Bytes of one channel's whole stack at the finest level the background copy takes; it copies that level and every coarser one.
    default: "268435456 (256 MB)"
  - name: PLEXORA_ROI_BRICK_BUDGET
    group: Z-stacks
    description: Disk, in bytes, kept for areas prepared at finer levels ("Prepare this area", and the section panes once the view settles); the areas used least recently go first.
    default: "4294967296 (4 GB)"
  - name: PLEXORA_IMS_CHUNK_CACHE_MB
    group: Z-stacks
    description: Memory, in MB, for decoded chunks of each Imaris channel read through HDF5's own chunk cache (up to six at once) -- used only for an Imaris file whose chunks Plexora does not decompress itself (anything but deflate, with or without shuffle).
    default: "96"
  - name: PLEXORA_CHUNK_CACHE_MB
    group: Z-stacks
    description: Memory, in MB, for decoded chunks of z-stacks, shared by every stack and channel being read -- an Imaris file's chunks and the bricks of a stack's 3-D copy. A plane next to one already read, a section beside the last, and the 3-D view's level reuse chunks instead of decompressing them again.
    default: "a quarter of the memory, at most 2048"
  - name: PLEXORA_DECODE_THREADS
    group: Z-stacks
    description: Threads that decompress z-stack chunks, outside the file locks the readers hold.
    default: "the number of cores, at most 8"
  - name: PLEXORA_SECTION_READ_BUDGET_MB
    group: Z-stacks
    description: What one tile of an XZ or YZ section may decompress, in MB. A section through a stack stored plane by plane reads every plane it crosses; past the budget the tile is computed at a coarser level and drawn up (and not cached), until the area is prepared in 3-D.
    default: "256"
  - name: PLEXORA_LEVEL_CACHE_MB
    group: Z-stacks
    description: Memory, in MB, for the 3-D view's levels already built (quantized voxels of one channel each), so a second viewer or a reload is not read again.
    default: "512"
  - name: PLEXORA_LEVEL_GATE
    group: Z-stacks
    description: How many 3-D view levels are built at once; further requests wait their turn.
    default: "3"
  - name: PLEXORA_SURFACE_BUDGET_TRIANGLES
    group: Z-stacks
    description: The most triangles one surface may have (Surface Studio). A request past it is refused with the estimate and what to change -- a lower quality, a smaller region or fewer cells -- rather than built and then not drawable in a browser.
    default: "5000000"
  - name: PLEXORA_SURFACE_PREVIEW_VOXELS
    group: Z-stacks
    description: Voxels the Surface Studio threshold preview reads (a coarse level of the area asked for, kept in memory while the slider moves).
    default: "2000000"
  - name: PLEXORA_PROJECTION_GATE
    group: Z-stacks
    description: How many projection tiles (MIP, mean and the like) are computed at once.
    default: "half the cores, at least 2"
  - name: PLEXORA_PLANE_CACHE
    group: Z-stacks
    description: How many planes of a z-stack are kept ready to read (their pyramids), for scrubbing back and forth through a deep stack.
    default: "512"
  - name: PLEXORA_WINDOW_SCAN
    group: Z-stacks
    description: Set to `inline` to compute a z-stack's brightness window before its first tile, as before; by default the first tiles use a provisional window and the exact one is computed in the background.

  - name: PLEXORA_AI_MODELS
    group: AI agents
    description: Path of the task-to-model file an agent driving Plexora over MCP follows (which model answers each gating and QC task). Defaults to `ai-models.yaml` beside the settings file; `plexora ai models init` writes a starting one. Absent, the agent chooses every model.
  - name: PLEXORA_MODEL_JUDGEMENT
    group: AI agents
    description: The model your agent client runs judgement work on (reading pictures, placing a gate). Overrides `plexora ai tiers judgement=<model>`; unset, the client picks its most capable model.
  - name: PLEXORA_MODEL_ROUTINE
    group: AI agents
    description: The model your agent client runs routine work on (tool relay, listing, write-ups). Overrides `plexora ai tiers routine=<model>`; unset, the client picks its cheapest model that calls tools reliably.
internal:
  - PLEXORA_ADMIN_TOKEN
  - PLEXORA_ALLOW_SOURCE_WRITES
  - PLEXORA_ASKPASS_NONCE
  - PLEXORA_ASKPASS_TIMEOUT
  - PLEXORA_ASKPASS_TOKEN
  - PLEXORA_ASKPASS_URL
  - PLEXORA_BENCH_CHROME
  - PLEXORA_CLI_REEXEC
  - PLEXORA_DESKTOP
  - PLEXORA_DESKTOP_CWD
  - PLEXORA_DESKTOP_LOG
  - PLEXORA_DESKTOP_PYTHON
  - PLEXORA_DESKTOP_RUNTIME
  - PLEXORA_FFMPEG
  - PLEXORA_GATING_MAX_EXTENSIONS
  - PLEXORA_GATING_ON_LIMIT
  - PLEXORA_QC_MAX_EXTENSIONS
  - PLEXORA_QC_ON_LIMIT
  - PLEXORA_QC_CHECKS
  - PLEXORA_QC_REFINE
  - PLEXORA_INSTALL_DONE
  - PLEXORA_LICENSE_FILE
  - PLEXORA_LICENSE_JOB_CERT
  - PLEXORA_MCP_LICENSE_RECHECK_S
  - PLEXORA_MCP_TOKEN
  - PLEXORA_MOUNT_DONE
  - PLEXORA_MOUNT_READONLY
  - PLEXORA_NOTEBOOK_MODE
  - PLEXORA_SERVER_IS_REMOTE
  - PLEXORA_SERVER_URL
  - PLEXORA_STARTUP_DONE
  - PLEXORA_TELEMETRY
  - PLEXORA_TELEMETRY_DEBUG
  - PLEXORA_TELEMETRY_ENDPOINT
  - PLEXORA_TESTING
  - PLEXORA_UPDATE_ENDPOINT
  - PLEXORA_UPDATE_INDEX
  - PLEXORA_UPDATE_RESTART
  - PLEXORA_WINDOW_SCANS_INLINE

ignore:
  PLEXORA_MODEL_: The prefix of PLEXORA_MODEL_<TIER> in plexora/ai/delegation.py.
  PLEXORA_CAN_RESTART: Flask config key.
  PLEXORA_DESKTOP__: A Rust format-string fragment, not a name.
  PLEXORA_IDLE: Shell heredoc marker in plexora/gcloud.py.
  PLEXORA_INSTALLED_PLUGINS: Flask config key.
  PLEXORA_LABEL_GPU: JavaScript constant.
  PLEXORA_LABEL_TILE: JavaScript constant.
  PLEXORA_NODE_DYNAMIC: Flask config key on a data node.
  PLEXORA_NODE_ID: Flask config key on a data node.
  PLEXORA_NODE_MANIFEST: Flask config key on a data node.
  PLEXORA_NODE_ORIGINS: Flask config key on a data node.
  PLEXORA_NODE_RESOURCES: Flask config key on a data node.
  PLEXORA_NS: UUID namespace constant.
  PLEXORA_SERVER_CONCURRENCY: JavaScript global set by the page template.
  PLEXORA_SERVING: Flask config key.
  PLEXORA_SSH_OK: Marker string printed over SSH.
  PLEXORA_TIMER: Shell heredoc marker in plexora/gcloud.py.
  PLEXORA_UNIT: Shell heredoc marker in plexora/gcloud.py.
  PLEXORA_UNREACHABLE: JavaScript constant.

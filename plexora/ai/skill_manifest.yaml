# Plexora's runtime scientific skills. Each names the tools it relies on;
# `plexora ai skills --check` (and tests/test_ai_skills.py) fails when one of
# them no longer exists, so a renamed tool breaks a test rather than an agent.
# `prompt` names the MCP prompt (a client's slash command) that opens the
# skill, for the skills a user starts from a menu.
version: "1"
skills:
  - name: dataset-triage
    title: Triage a project or dataset before analysing it
    description: What is here, what state it is in, and what can be done with it.
    when: First contact with any project or dataset, or when a request is vague.
    tools: [server_info, list_datasets, get_dataset, list_projects, inspect_project,
            get_resource_status, list_channels, list_markers, validate_scope]
  - name: visual-inspection
    title: Look at the tissue and say what is there
    description: Render regions with the right channels and overlays, and describe only what the pixels show.
    when: The user asks to see, show, look at or describe a region, a marker or a cell.
    tools: [inspect_project, list_channels, render_region, list_rois, get_artifact]
  - name: marker-qc
    title: Quality-check a marker before trusting it
    description: Is the stain real, is the column the channel, is the distribution usable.
    when: Before gating or interpreting a marker, or when a marker "looks wrong".
    tools: [list_markers, list_channels, get_marker_distribution, get_gate_distribution,
            render_region]
  - name: visual-gating
    title: Gate one marker by hand and check it by eye
    description: Profile, a starting gate, pixel-budgeted collages, qualitative adjustment, receipts.
    when: The user wants to gate or check one marker interactively, step by step.
    tools: [get_gate, profile_marker, get_gate_distribution, set_gate, viewer_preview_gate,
            render_gating_collage, render_gate_validation, render_cell_gallery, explain_cell,
            adjust_gate, undo_operation, get_gated_summary, write_gates_to_source]
  - name: gate-image
    prompt: gate_image
    title: Gate every marker of an image automatically
    description: A gating session -- deterministic where the numbers suffice, one small decision packet at a time where they do not.
    when: The user asks to gate an image, threshold all markers, or call positives for the panel.
    tools: [inspect_project, inspect_expression_sources, set_expression_source,
            set_pixel_size, get_panel_context, set_panel_context, gating_session_start,
            gating_next, gating_answer, gating_session_status, gating_session_finish, gating_qc,
            gating_report, export_gates, get_all_gates, reset_gates, undo_operation,
            write_gates_to_source]
  - name: gate-dataset
    prompt: gate_dataset
    title: Gate every image of a dataset from a reference image
    description: One session; the reference gated in full, gates carried to the rest through intensity alignment, drift classes and a strategy per marker.
    when: The user asks to gate a dataset, a cohort, or several slides consistently.
    tools: [get_dataset, inspect_project, get_panel_context, set_panel_context,
            compare_gates_across_images, job_wait, gating_session_start, gating_next,
            gating_answer, gating_session_status, gating_session_finish, gating_report,
            export_gates, set_pixel_size]
  - name: review-gating
    prompt: review_gating
    title: Review, approve or lock gates
    description: Provenance and panel-wide consistency first, then the user's decisions -- approve, lock, exclude, undo.
    when: The user asks to review, approve, lock or undo gates, or after a gating session.
    tools: [get_all_gates, gating_qc, get_gate_provenance, render_gating_collage,
            bivariate_evidence, set_gate_status, undo_operation, gating_report]
  - name: diagnose-marker
    prompt: diagnose_marker
    title: Find out why a marker is hard to gate
    description: The profile's numbers and flags first, then the one picture that settles the question.
    when: A marker ended in review or failed, or the user asks why a marker is hard or looks wrong.
    tools: [profile_marker, render_gating_collage, bivariate_evidence, sample_gating_cells,
            render_cell_gallery, explain_cell, render_region, get_panel_context]
  - name: qc-image
    prompt: qc_image
    title: Quality-control an image automatically
    description: A deterministic scan finds where to look; you audit every channel at a glance, confirm artifacts and choose outlines among proposals; artifacts become ROIs and cells get pass/fail.
    when: The user asks to QC an image, find artifacts, folds, blur, aggregates or failed channels, or flag bad cells.
    tools: [inspect_project, set_pixel_size, qc_session_start, qc_next, qc_answer,
            qc_session_status, qc_session_finish, qc_report, get_qc_results,
            set_qc_strictness, set_qc_cycles, export_qc, list_rois, undo_operation,
            write_qc_to_source]
  - name: review-qc
    prompt: review_qc
    title: Review QC regions and cell flags
    description: Read the results and their provenance first, then make the user's decisions -- strictness, approvals, edits, undo.
    when: The user asks to review, loosen or tighten QC, or after a QC session.
    tools: [get_qc_results, list_qc_results, list_rois, get_roi, update_roi, delete_roi,
            render_qc_overview, set_qc_strictness, approve_qc_roi, refresh_qc,
            undo_operation, qc_report, export_qc]

# Plexora's shipped marker vocabulary: what a marker is, where it should
# stain, and how it relates to its neighbours in a panel.
#
# Automatic gating grounds its biology here rather than in a model's memory:
# an entry here outranks anything an agent fills in, and agent-supplied
# context can only lower a gate's confidence, never move the gate
# (plexora/plugins/gating/server/autogate/context.py).
#
# role       context | lineage_reliable | lineage_other | tumour_stromal | state | signalling
#            (gating order: context is never gated; the rest in that order)
# relation   subset       this marker's positives should be positive for the partner
#            coexpressed  the two are usually positive together
#            exclusive    the two should almost never be positive together
#            subset_any   every positive is positive for at least one of the marker's
#                         subset_any partners, one per lineage that carries it, and only
#                         some cells of each are (LAG-3 on T or NK cells). Two or more.
#                         It draws a look's expected partner; nothing that weighs a gate
#                         reads it, and on a panel missing one of them it is not used
# confidence high | moderate | low
# expression which cells carry the marker, in plain words, and how that varies with
#            the tissue. A marker whose carriers depend on the tissue (PD-L1, HLA-DR)
#            names no partners here: a gating session's planner fills its empty partner
#            slots from this note and the panel's lineages, and reviews every relation
#            here against the tissue or disease named or inferred; only a change it is
#            sure of twice is made (autogate/context.py `settle_review`), for that
#            context only
#
# These relations hold in general. A tissue or disease can break one (an immune
# disease, a cancer whose tumour cells carry a myeloid marker): the review is
# where that is caught, never by editing a relation here for one sample.
# binary     false for markers expressed on a continuum (HLA-ABC, B2M, PD-L1): there
#            is no valley, but there is background, so the gate marks where real
#            expression rises out of it (autogate/scoring.py, the `onset`
#            candidate) -- such a marker is gated, never skipped as "not binary"
# morphology cell (the default) | fibrous: fibres, processes or vessel walls run
#            between cells and across their masks, so stain beside a nucleus is
#            weak evidence of its own; a classifier check moves such a gate only
#            on rows read as the cells' own stain, never on `mixed`
#            (autogate/cellcalls.reading_for)
#
# A channel whose name plainly says nuclear stain (DAPI3, Hoechst_2, Nucleus2,
# DNA_1) or autofluorescence / blank (AF1, Blank_3) resolves to DNA or
# Autofluorescence by pattern even when its spelling is not a synonym below
# (vocabulary.structural); both are role context and never gated.
version: "3"
markers:
  - canonical: DNA
    synonyms: [DAPI, Hoechst, Hoechst33342, H3342, Ir191, Ir193, Iridium, Nuclear, Nuclei,
               Nucleus, DNA1, DNA2, SYTO13, DRAQ5, Histone H3]
    role: context
    compartment: nuclear
    lineage: all nucleated cells
    binary: false
    caveats: ["a structural stain; used for tissue, focus and segmentation checks"]

  - canonical: Autofluorescence
    synonyms: [AF, Blank, Background, Empty, Autofluor]
    role: context
    compartment: cytoplasmic
    lineage: none
    binary: false
    caveats: [a control channel; cells bright here are autofluorescent in every channel]

  - canonical: CD45
    synonyms: [PTPRC, LCA]
    role: lineage_reliable
    compartment: membrane
    lineage: immune (all leukocytes)
    expression: "every leukocyte, lymphoid and myeloid; never epithelial, tumour, stromal or
      endothelial cells; dim on some myeloid and plasma cells"
    binary: true
    partners:
      - {marker: PanCK, relation: exclusive, confidence: high}
      - {marker: SOX10, relation: exclusive, confidence: high}
      - {marker: aSMA, relation: exclusive, confidence: moderate}
    caveats: [membrane ring; weak on some myeloid cells and plasma cells]

  # The CD45 isoforms are their own markers, not spellings of CD45: each is
  # carried by only some leukocytes, so neither can stand in for pan-CD45.
  - canonical: CD45RA
    synonyms: [CD45-RA]
    role: state
    compartment: membrane
    lineage: naive T cells, B cells and most NK cells
    expression: "naive T cells, most B cells and NK cells; an isoform of CD45, so only on CD45+
      immune cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD45RO, relation: exclusive, confidence: moderate}
    caveats: [cells switching from naive to memory carry both isoforms for a while]

  - canonical: CD45RO
    synonyms: [CD45-RO]
    role: state
    compartment: membrane
    lineage: memory and activated T cells; also some myeloid cells
    expression: "memory and activated T cells, some myeloid cells; an isoform of CD45, so only on
      CD45+ immune cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD45RA, relation: exclusive, confidence: moderate}
    caveats: [cells switching from naive to memory carry both isoforms for a while]

  - canonical: CD3
    synonyms: [CD3e, CD3E, CD3D, CD3G]
    role: lineage_reliable
    compartment: membrane
    lineage: T cells
    expression: "every T cell (helper, cytotoxic, regulatory, gamma-delta); not B, NK, myeloid or
      non-immune cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD20, relation: exclusive, confidence: high}
      - {marker: CD19, relation: exclusive, confidence: high}
      - {marker: PanCK, relation: exclusive, confidence: high}
      - {marker: CD68, relation: exclusive, confidence: moderate}
    caveats: [dense lymphoid aggregates bleed between touching cells]

  - canonical: CD4
    synonyms: [CD4A]
    role: lineage_other
    compartment: membrane
    lineage: helper T cells; also monocytes and macrophages (weaker)
    expression: "helper and regulatory T cells, bright; monocytes, macrophages and some dendritic
      cells, dim"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD3, relation: coexpressed, confidence: moderate}
      - {marker: CD8, relation: exclusive, confidence: moderate}
      - {marker: CD20, relation: exclusive, confidence: high}
    caveats: ["CD4+CD3- cells are usually macrophages, not a wrong gate",
              "monocytes and macrophages carry it far dimmer than T cells; a gate above
              them misses a real population"]

  - canonical: CD8
    synonyms: [CD8a, CD8A, CD8b, CD8B, CD8alpha]
    role: lineage_other
    compartment: membrane
    lineage: cytotoxic T cells
    expression: "cytotoxic T cells; dimmer on some NK cells and a dendritic-cell subset"
    binary: true
    partners:
      - {marker: CD3, relation: subset, confidence: high}
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD4, relation: exclusive, confidence: moderate}
      - {marker: CD20, relation: exclusive, confidence: high}
      - {marker: PanCK, relation: exclusive, confidence: high}

  - canonical: CD20
    synonyms: [MS4A1]
    role: lineage_reliable
    compartment: membrane
    lineage: B cells
    expression: "B cells (naive, memory, germinal centre); lost by plasma cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD3, relation: exclusive, confidence: high}
      - {marker: PanCK, relation: exclusive, confidence: high}

  - canonical: CD19
    synonyms: []
    role: lineage_other
    compartment: membrane
    lineage: B cells
    expression: "B cells, including early plasmablasts: broader than CD20 within the B lineage"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD20, relation: coexpressed, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: high}

  - canonical: CD68
    synonyms: [KP1]
    role: lineage_other
    compartment: cytoplasmic
    lineage: macrophages and monocytes
    expression: "macrophages and monocytes, granular in the cytoplasm; dimmer on dendritic cells,
      some fibroblasts and some tumour cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: moderate}
      - {marker: PanCK, relation: exclusive, confidence: moderate}
    caveats: [granular lysosomal stain; macrophages are often autofluorescent]

  - canonical: CD163
    synonyms: []
    role: lineage_other
    compartment: membrane
    lineage: M2-like macrophages
    expression: "M2-like and tissue-resident macrophages: a subset of the CD68+ macrophages"
    binary: true
    partners:
      - {marker: CD68, relation: coexpressed, confidence: moderate}
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: moderate}

  - canonical: CD11b
    synonyms: [ITGAM]
    role: lineage_other
    compartment: membrane
    lineage: myeloid cells
    expression: "myeloid cells (monocytes, macrophages, neutrophils, some dendritic cells) and NK
      cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: moderate}

  - canonical: CD11c
    synonyms: [ITGAX]
    role: lineage_other
    compartment: membrane
    lineage: dendritic cells and some macrophages
    expression: "dendritic cells and many macrophages; some activated B and NK cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: moderate}

  - canonical: CD56
    synonyms: [NCAM1, NCAM]
    role: lineage_other
    compartment: membrane
    lineage: NK cells; neuroendocrine cells
    expression: "NK cells; some T cells (NKT), neuroendocrine cells and nerves"
    binary: true
    partners:
      - {marker: CD3, relation: exclusive, confidence: low}

  - canonical: CD16
    synonyms: [FCGR3A, FCGR3, FcgRIII]
    role: lineage_other
    compartment: membrane
    lineage: NK cells, non-classical monocytes, neutrophils and some macrophages
    expression: "NK cells, non-classical monocytes, neutrophils and some macrophages"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: PanCK, relation: exclusive, confidence: high}
      - {marker: CD3, relation: exclusive, confidence: moderate}
    caveats: [membrane ring; neutrophils stain bright and spill onto touching cells]

  - canonical: CD57
    synonyms: [B3GAT1, HNK1, HNK-1, LEU7, Leu-7]
    role: lineage_other
    compartment: membrane
    lineage: NK cells and terminally differentiated T cells
    expression: "terminally differentiated NK and T cells; also neural and neuroendocrine cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: PanCK, relation: exclusive, confidence: moderate}
    caveats: ["also on some neural and neuroendocrine cells, so in tissue it is often
              positive only within CD45-positive cells"]

  - canonical: ELANE
    synonyms: [Neutrophil elastase, NeutrophilElastase, ELA2]
    role: lineage_other
    compartment: cytoplasmic
    lineage: neutrophils (granules)
    expression: "neutrophils only, in their granules; outside cells in extracellular traps"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: exclusive, confidence: high}
    caveats: [granular cytoplasmic stain; extracellular traps stain between cells]

  - canonical: FOXP3
    synonyms: [FoxP3, FOXP-3]
    role: state
    compartment: nuclear
    lineage: regulatory T cells
    expression: "regulatory T cells (CD3+CD4+, rarely CD8+); weak in some tumours"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD4, relation: subset, confidence: high}
      - {marker: CD3, relation: subset, confidence: high}
      - {marker: CD8, relation: exclusive, confidence: moderate}
    caveats: [small nuclear dot; weak and easy to confuse with nuclear bleed-through]

  - canonical: PanCK
    synonyms: [Pan-cytokeratin, pan-CK, panCK, Pan CK, KRT, CK, Cytokeratin, Keratin,
               AE1/AE3, AE1AE3, CK8, CK18, CK8/18, KRT8, KRT18]
    role: lineage_reliable
    compartment: cytoplasmic
    lineage: epithelial and carcinoma cells
    expression: "epithelial and carcinoma cells, mesothelium; not immune, stromal or endothelial
      cells"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: high}
      - {marker: CD3, relation: exclusive, confidence: high}
    caveats: [bright cytoplasm spills into touching immune cells in dense tumour]

  - canonical: ECAD
    synonyms: [E-cadherin, Ecadherin, CDH1]
    role: tumour_stromal
    compartment: membrane
    lineage: epithelial cells
    expression: "epithelial cells, at their junctions; reduced on invasive or poorly cohesive tumour
      cells"
    binary: true
    partners:
      - {marker: PanCK, relation: coexpressed, confidence: high}
      - {marker: CD45, relation: exclusive, confidence: high}

  - canonical: SOX10
    synonyms: []
    role: lineage_reliable
    compartment: nuclear
    lineage: melanocytes, melanoma, glia
    expression: "melanocytes and melanoma, Schwann cells and glia, myoepithelial cells"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: high}
      - {marker: MART1, relation: coexpressed, confidence: moderate}
    caveats: [nuclear; melanin can darken or autofluoresce in pigmented lesions]

  - canonical: MART1
    synonyms: [MLANA, Melan-A, MelanA]
    role: tumour_stromal
    compartment: cytoplasmic
    lineage: melanocytes and melanoma
    expression: "melanocytes and differentiated melanoma; lost on dedifferentiated melanoma"
    binary: true
    partners:
      - {marker: SOX10, relation: coexpressed, confidence: moderate}
      - {marker: CD45, relation: exclusive, confidence: high}

  - canonical: S100
    synonyms: [S100B, S100A]
    role: tumour_stromal
    compartment: nuclear_cytoplasmic
    lineage: melanocytic, neural and dendritic cells
    expression: "melanocytic and neural cells, Langerhans and other dendritic cells, some
      macrophages and myoepithelium"
    binary: false
    partners:
      - {marker: SOX10, relation: coexpressed, confidence: moderate}
    caveats: [graded expression; dendritic cells are positive too]

  - canonical: Ki67
    synonyms: [MKI67, KI-67, Ki-67]
    role: state
    compartment: nuclear
    lineage: cycling cells (any lineage)
    expression: "cycling cells of any lineage (tumour, immune, stromal): no lineage holds all of its
      positives"
    binary: true
    caveats: [intensity follows the cell cycle; a dim tail of G1 cells is expected]

  - canonical: PD1
    synonyms: [PD-1, PDCD1, CD279]
    role: state
    compartment: membrane
    lineage: activated and exhausted T cells
    expression: "activated and exhausted T cells, brightest on follicular helper T cells; weak on
      some B and myeloid cells"
    binary: true
    partners:
      - {marker: CD3, relation: subset, confidence: moderate}
      - {marker: CD45, relation: subset, confidence: moderate}
    caveats: [often dim; germinal-centre T cells are the brightest]

  - canonical: PDL1
    synonyms: [PD-L1, CD274]
    role: state
    compartment: membrane
    lineage: tumour cells, macrophages, dendritic cells
    expression: "mostly myeloid cells (macrophages, dendritic cells); tumour cells in some cancers;
      weak on activated T and B cells. Which lineages carry it, and how many of their
      cells, depends on the tumour"
    binary: false
    caveats: ["graded; scored clinically by fraction at a fixed cut-off, not by a valley"]

  - canonical: GZMB
    synonyms: [Granzyme B, GranzymeB, GZM-B]
    role: state
    compartment: cytoplasmic
    lineage: cytotoxic T and NK cells
    expression: "cytotoxic T cells and NK cells; plasmacytoid dendritic cells in some tissues"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}

  - canonical: HLADR
    synonyms: [HLA-DR, HLA DR, MHCII, MHC-II]
    role: state
    compartment: membrane
    lineage: antigen-presenting cells; activated T cells; some tumours
    expression: "antigen-presenting cells (dendritic cells, macrophages, B cells); activated T
      cells; tumour cells in some cancers. Which lineages carry it depends on the tissue"
    binary: false

  - canonical: aSMA
    synonyms: [SMA, alpha-SMA, alphaSMA, ACTA2, a-SMA]
    role: tumour_stromal
    compartment: cytoplasmic
    lineage: myofibroblasts, smooth muscle, pericytes
    expression: "smooth muscle, myofibroblasts and pericytes: vessel walls and stroma"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: moderate}
      - {marker: PanCK, relation: exclusive, confidence: moderate}
    caveats: ["fibres between cells are assigned to whichever mask they cross",
              "pericytes and myofibroblasts beside vessels are often round in section:
              stain hugging their outline is theirs, as for spindle cells"]
    morphology: fibrous

  - canonical: CD31
    synonyms: [PECAM1, PECAM-1]
    role: tumour_stromal
    compartment: membrane
    lineage: endothelial cells
    expression: "endothelial cells; dimmer on platelets, some macrophages and some leukocytes"
    binary: true
    morphology: fibrous
    caveats: [thin vessel walls wrap the nuclei beside them]
    partners:
      - {marker: PanCK, relation: exclusive, confidence: high}
      - {marker: CD45, relation: exclusive, confidence: low}

  - canonical: Vimentin
    synonyms: [VIM]
    role: tumour_stromal
    compartment: cytoplasmic
    lineage: mesenchymal cells (and many others)
    expression: "mesenchymal cells (fibroblasts, endothelium, smooth muscle), immune cells and some
      tumours: broad"
    binary: false
    caveats: [broadly and gradedly expressed]
    morphology: fibrous

  - canonical: pERK
    synonyms: [p-ERK, pERK1/2, phospho-ERK, pMAPK]
    role: signalling
    compartment: nuclear_cytoplasmic
    lineage: any
    expression: "any cell with active MAPK signalling"
    binary: false
    caveats: [a signalling readout; gate only on explicit request]

  - canonical: pS6
    synonyms: [p-S6, pS6RP, phospho-S6]
    role: signalling
    compartment: cytoplasmic
    lineage: any
    expression: "any cell with active mTOR signalling"
    binary: false
    caveats: [a signalling readout; gate only on explicit request]

  - canonical: pSTAT3
    synonyms: [p-STAT3, phospho-STAT3]
    role: signalling
    compartment: nuclear
    lineage: any
    expression: "any cell with active STAT3 signalling (cytokine-stimulated immune, tumour or
      stromal cells)"
    binary: false
    caveats: [a signalling readout; gate only on explicit request]

  - canonical: HLAABC
    synonyms: [HLA-ABC, HLA ABC, HLA-A/B/C, HLA-I, HLA class I, MHCI, MHC-I, MHC class I]
    role: state
    compartment: membrane
    lineage: all nucleated cells; lost or reduced on some tumour cells
    expression: "all nucleated cells; lost or reduced on some tumour cells"
    binary: false
    partners:
      - {marker: B2M, relation: coexpressed, confidence: high}
    caveats: ["most cells are positive; the gate marks where expression leaves background,
              and the negatives (often tumour cells that lost MHC-I) are the finding"]

  - canonical: B2M
    synonyms: [beta2-microglobulin, beta-2-microglobulin, B2-microglobulin, b2-m, beta2m]
    role: state
    compartment: membrane
    lineage: all nucleated cells; lost or reduced on some tumour cells
    expression: "all nucleated cells, with HLA class I; lost or reduced on some tumour cells"
    binary: false
    partners:
      - {marker: HLAABC, relation: coexpressed, confidence: high}
    caveats: [most cells are positive; read beside HLA class I]

  - canonical: PCNA
    synonyms: [PCNA1]
    role: state
    compartment: nuclear
    lineage: cycling cells (any lineage)
    expression: "cycling and repairing cells of any lineage"
    binary: false
    partners:
      - {marker: Ki67, relation: coexpressed, confidence: moderate}
    caveats: ["a high dynamic range, dim to bright: graded through the cell cycle and brightest
               in S phase",
              "a dim even nuclear fill above the unstained nuclei is PCNA too (G1, repair, a
               long-lived protein), not background: the gate calls the stain, not the S phase",
              "evenly dim nuclei across a whole nest or layer are PCNA (G1), not haze: haze lies
               between the nuclei too, PCNA fills them"]

  - canonical: TIM3
    synonyms: [TIM-3, HAVCR2, CD366]
    role: state
    compartment: membrane
    lineage: exhausted T cells, NK cells, macrophages and dendritic cells
    expression: "exhausted T cells, NK cells, macrophages and dendritic cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: subset_any, confidence: moderate}
      - {marker: CD56, relation: subset_any, confidence: moderate}
      - {marker: CD68, relation: subset_any, confidence: moderate}
      - {marker: CD11c, relation: subset_any, confidence: moderate}
    caveats: [weak and broad on myeloid cells; dense infiltrates spill between neighbours]

  - canonical: LAG3
    synonyms: [LAG-3, CD223]
    role: state
    compartment: membrane
    lineage: activated and exhausted T cells, NK cells
    expression: "activated and exhausted T cells and NK cells; a few plasmacytoid dendritic cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: subset_any, confidence: moderate}
      - {marker: CD56, relation: subset_any, confidence: moderate}
    caveats: [low dynamic range in most panels; few positives]

  - canonical: TIGIT
    synonyms: [VSIG9, VSTM3]
    role: state
    compartment: membrane
    lineage: T cells and NK cells
    expression: "T cells (regulatory, exhausted, follicular helper) and NK cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: subset_any, confidence: moderate}
      - {marker: CD56, relation: subset_any, confidence: moderate}

  - canonical: CTLA4
    synonyms: [CTLA-4, CD152]
    role: state
    compartment: cytoplasmic
    lineage: regulatory and activated T cells
    expression: "regulatory and activated T cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD3, relation: subset, confidence: moderate}
    caveats: ["largely intracellular vesicles, dotty rather than a ring"]

  - canonical: TCF1
    synonyms: [TCF-1, TCF7, TCF 1]
    role: state
    compartment: nuclear
    lineage: naive and stem-like memory T cells
    expression: "naive and stem-like memory T cells; some NK and innate lymphoid cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: subset, confidence: moderate}
    caveats: [some clones stain epidermis off-target; read it within CD3+ or CD45+ cells]

  - canonical: TBX21
    synonyms: [T-bet, TBET, Tbet]
    role: state
    compartment: nuclear
    lineage: Th1 and cytotoxic T cells, NK cells, some B cells
    expression: "Th1 and cytotoxic T cells, NK cells, some memory B cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: high}
      - {marker: CD3, relation: subset_any, confidence: moderate}
      - {marker: CD56, relation: subset_any, confidence: moderate}
      - {marker: CD20, relation: subset_any, confidence: moderate}

  - canonical: CD103
    synonyms: [ITGAE, alphaE integrin]
    role: state
    compartment: membrane
    lineage: tissue-resident memory T cells, some dendritic cells
    expression: "tissue-resident memory T cells (mostly CD8+) and intraepithelial lymphocytes; some
      dendritic cells"
    binary: true
    partners:
      - {marker: CD45, relation: subset, confidence: moderate}
      - {marker: CD3, relation: subset_any, confidence: moderate}
      - {marker: CD11c, relation: subset_any, confidence: moderate}

  - canonical: TUBB3
    synonyms: [TubbIII, TUBB-III, beta-III tubulin, beta3-tubulin, TUJ1]
    role: tumour_stromal
    compartment: cytoplasmic
    lineage: neurons and nerves; many melanomas and other tumours
    expression: "neurons and nerves; many melanomas and some carcinomas"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: moderate}
    caveats: [nerve twigs are thin and bright; tumour cells graded]

  - canonical: NGFR
    synonyms: [CD271, p75NTR, p75 NTR]
    role: tumour_stromal
    compartment: membrane
    lineage: neural crest-derived cells, nerves, dedifferentiated melanoma
    expression: "nerves and Schwann cells, neural crest-derived and dedifferentiated melanoma cells,
      some fibroblasts"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: moderate}
      - {marker: SOX10, relation: coexpressed, confidence: low}

  - canonical: SOX9
    synonyms: [SOX-9]
    role: tumour_stromal
    compartment: nuclear
    lineage: epithelial progenitors, chondrocytes, some melanomas
    expression: "epithelial progenitors and some carcinomas, chondrocytes, some melanomas"
    binary: true
    partners:
      - {marker: CD45, relation: exclusive, confidence: moderate}

  - canonical: CD138
    synonyms: [SDC1, Syndecan-1, Syndecan1]
    role: lineage_other
    compartment: membrane
    lineage: plasma cells; also squamous epithelium
    expression: "plasma cells; squamous and other epithelia; some carcinomas"
    binary: true
    partners:
      - {marker: CD3, relation: exclusive, confidence: moderate}
    caveats: [keratinocytes are strongly positive; plasma cells are the immune readout]

  - canonical: CXCL10
    synonyms: [IP-10, IP10]
    role: signalling
    compartment: cytoplasmic
    lineage: interferon-responsive macrophages, tumour and endothelial cells
    expression: "interferon-responsive macrophages, tumour and endothelial cells; secreted"
    binary: false
    caveats: [a secreted chemokine; vessels autofluoresce in its channel in some panels]

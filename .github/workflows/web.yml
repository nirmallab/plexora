name: web

# The website (viewer.plexoraapp.com; docs/internal/WEBSITE_RELEASE.md): the
# static shell Cloudflare Pages serves and the Python bundle the assets bucket
# serves, built and checked on every pull request and push to main; on main,
# a preview deploy once the Cloudflare secrets exist.
#
#   static        both static builds (served locally for the smoke; the
#                 preview's, which loads py/dev/<sha>/ and asks not to be
#                 indexed); what Pages takes (budget.py --site); the website's
#                 Python and JS tests, the node probes among them
#   bundle        the Python bundle (tools/browser_build/build.py), cached on
#                 Pyodide's version, uv.lock, build.py and the stage list: a
#                 hit rebuilds Plexora's wheels alone (--plexora-only, about a
#                 minute; a miss is the whole build, 15-30 minutes), with
#                 plexora-kernels' Pyodide wheel built first; the first
#                 visit's Python under its bar (budget.py --bundle); the
#                 bundle says this checkout's version
#   import_check  the bundle booted in Node from disk: the app builds with no
#                 stage, every gating/QC/AI module imports, discover()
#                 registers the plugins, a calibrated image reports its pixel
#                 size (tests/browser/import_check.mjs)
#   smoke         headless Chromium on SwiftShader, correctness only: the site
#                 boots, Python is ready, a picked image opens and draws, no
#                 policy violation; the shell a first visit loads under its bar
#                 (tests/browser/smoke.mjs, budget.py --shell)
#   preview       main only: the bundle to py/dev/<sha>/ on the assets bucket,
#                 read back from https://assets.plexoraapp.com, the preview's
#                 shell to the Pages project plexora-viewer-preview, and the
#                 previous development bundle pruned (publish.py current)
#
# The preview needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the
# repository secrets backend.yml uses, with Pages: Edit and Workers R2
# Storage: Edit added); without them it says so and deploys nothing.
# Wrangler runs as an exact version through npx, never `latest`.

on:
  pull_request:
    paths-ignore: ["desktop/**", "backend/**", "website/**", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["desktop/**", "backend/**", "website/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # A pull request's older run is replaced; main's runs queue, so a preview
  # deploy is never stopped halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LINK_MODE: copy
  UV_PYTHON: "3.13"
  PLEXORA_WRANGLER: npx --yes wrangler@3.114.17
  ASSETS: https://assets.plexoraapp.com

jobs:
  static:
    name: Static build, Pages limits, the website's tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plexora/client/package-lock.json
      - name: Environment, as uv.lock pins it
        run: |
          echo "PLEXORA_DATA_PATH=$RUNNER_TEMP/plexora-data" >> "$GITHUB_ENV"
          uv sync --locked --extra dev --extra spatial --extra wsi --extra remote --extra jupyter --extra ai --extra bridge
      - name: Client packages for the JS probes
        run: npm ci --prefix plexora/client --no-audit --no-fund
      - name: Static builds, and the image the smoke opens
        env:
          SHA: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/web"
          uv run --no-sync python -m plexora.client.static_build --out "$out/static"
          uv run --no-sync python -m plexora.client.static_build --out "$out/preview" \
            --py "$ASSETS/py/dev/${SHA::12}/" --models "$ASSETS/models/" --flags "$ASSETS/flags.json" --noindex
          uv run --no-sync python tests/browser/smoke_fixture.py "$out/fixture"
      - name: What Pages takes
        run: python tools/browser_build/budget.py --site "$RUNNER_TEMP/web/static"
      - name: The website's Python and JS tests
        run: |
          uv run --no-sync python -m pytest -q -p no:randomly -m "not perf" -n 4 --dist loadfile \
            tests/test_static_build.py tests/test_web_budget.py tests/test_web_workflows.py \
            tests/test_browser_publish.py tests/test_browser_build.py tests/test_release_script.py \
            tests/test_stages.py tests/test_boot.py tests/test_bridge.py tests/test_cooperative.py \
            tests/test_work.py tests/test_imagecodecs_shim.py tests/test_fast_png_fallback.py \
            tests/test_browser_imports.py tests/test_browser_routes.py tests/test_browser_guard.py \
            tests/test_browser_columns.py tests/test_browser_table_provider.py \
            tests/test_browser_node_lzw.py tests/test_browser_node_spec.py \
            tests/test_browser_page_pyramid.py tests/test_browser_page_window.py \
            tests/test_browser_sam.py tests/test_tiff_writer.py tests/test_backend_shim_js.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-static
          path: ${{ runner.temp }}/web
          retention-days: 3

  bundle:
    name: Python bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - id: version
        name: Versions
        run: |
          echo "PLEXORA_BENCH_HOME=$HOME/.cache/plexora-web" >> "$GITHUB_ENV"
          echo "PLEXORA_DATA_PATH=$RUNNER_TEMP/plexora-data" >> "$GITHUB_ENV"
          echo "pyodide=$(sed -n 's/^PYODIDE = "\(.*\)"$/\1/p' tools/browser_build/build.py)" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      # The build runs this checkout's Python (plexora imported, its wheel
      # built with pip), a CPython 3.14 that compiles Pyodide's bytecode, and
      # brotli. The pure wheels come at uv.lock's versions whatever is
      # installed; only the core environment is needed.
      - name: What the build runs
        run: |
          uv sync --locked
          uv pip install --python .venv/bin/python pip "setuptools>=77" wheel
          uv python install 3.14
          echo "PLEXORA_PYTHON314=$(uv python find 3.14)" >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y -q brotli
          echo "PLEXORA_BROTLI=$(command -v brotli)" >> "$GITHUB_ENV"
      - id: cached
        name: The bundle's packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/plexora-web/browser_node/web/py
          key: web-bundle-${{ steps.version.outputs.pyodide }}-${{ hashFiles('uv.lock', 'tools/browser_build/build.py', 'plexora/browser/stages.py') }}
      # Only a whole build reads it.
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Pyodide's release archive (337 MB, sha256-checked by build.py)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/plexora-web/browser_node/pyodide/pyodide-${{ steps.version.outputs.pyodide }}.tar.bz2
          key: pyodide-${{ steps.version.outputs.pyodide }}
      # plexora-kernels for Pyodide (kernels/, plan L5; kernels.yml builds
      # every platform and holds the ports to numba): the base stage ships it,
      # and build.py refuses one ported from other kernels than this
      # checkout's. cibuildwheel runs its tests in Node.
      - name: plexora-kernels for the website (cibuildwheel --platform pyodide)
        run: |
          uvx --from cibuildwheel==4.3.5 cibuildwheel --platform pyodide --output-dir kernels/dist kernels
          echo "PLEXORA_KERNELS_WHEEL=$(ls kernels/dist/plexora_kernels-*-pyemscripten_*_wasm32.whl)" >> "$GITHUB_ENV"
      - name: Build (Plexora's wheel alone when the packages are cached)
        env:
          HIT: ${{ steps.cached.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            uv run --no-sync python tools/browser_build/build.py --plexora-only
          else
            uv run --no-sync python tools/browser_build/build.py
          fi
      - name: The first visit's Python is under its bar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/browser_build/budget.py --bundle "$PLEXORA_BENCH_HOME/browser_node/web/py/$VERSION"
      - name: The bundle says this checkout's version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py propagate --check --bundle "$PLEXORA_BENCH_HOME/browser_node/web/py/$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-bundle
          path: ~/.cache/plexora-web/browser_node/web/py/${{ steps.version.outputs.version }}
          compression-level: 1
          retention-days: 3

  import_check:
    name: The bundle boots in Node
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-bundle
          path: ${{ runner.temp }}/bundle
      - name: Boot, imports, discover, a calibrated image
        run: node tests/browser/import_check.mjs --bundle "$RUNNER_TEMP/bundle"

  smoke:
    name: Smoke (headless Chromium, SwiftShader)
    needs: [static, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # serve.py is the standard library alone.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/poc_browser_node/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-bundle
          path: ${{ runner.temp }}/py/${{ needs.bundle.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-static
          path: ${{ runner.temp }}/web
      - name: playwright-core, as the lockfile pins it
        run: npm ci --prefix tools/poc_browser_node --no-audit --no-fund
      - name: Playwright's Chromium and what it needs
        run: node tools/poc_browser_node/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Boot, open a picked image, no policy violation
        env:
          PLEXORA_PYTHON: python
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          node tests/browser/smoke.mjs --swiftshader --site "$RUNNER_TEMP/web/static" --py "$RUNNER_TEMP/py" \
            --fixture "$RUNNER_TEMP/web/fixture/smoke.ome.tif" --shell-out "$RUNNER_TEMP/shell.json" \
            --shots "$RUNNER_TEMP/shots"
      - name: The shell a first visit loads is under its bar
        run: python tools/browser_build/budget.py --shell "$RUNNER_TEMP/shell.json"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  preview:
    name: Preview deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, bundle, import_check, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: website-preview
    concurrency:
      group: web-preview
      cancel-in-progress: false
    steps:
      - id: gate
        name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the preview is not deployed (docs/internal/WEBSITE_RELEASE.md)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # publish.py is the standard library and wrangler; nothing of the
      # project's runs beside the token.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-bundle
          path: ${{ runner.temp }}/bundle
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-static
          path: ${{ runner.temp }}/web
      # Fetched once, without the token in the environment, before the
      # uploads run it six at a time.
      - if: steps.gate.outputs.deploy == 'true'
        name: Wrangler
        run: $PLEXORA_WRANGLER --version
      - if: steps.gate.outputs.deploy == 'true'
        name: Bundle to py/dev/<sha>/, read back, shell to plexora-viewer-preview, the old bundle pruned
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prefix="py/dev/${SHA::12}/"
          before=$(python tools/browser_build/publish.py current)
          python tools/browser_build/publish.py assets --bundle "$RUNNER_TEMP/bundle" --prefix "$prefix" --dev
          python tools/browser_build/publish.py verify --bundle "$RUNNER_TEMP/bundle" --base "$ASSETS/$prefix"
          python tools/browser_build/publish.py site --dir "$RUNNER_TEMP/web/preview" \
            --project plexora-viewer-preview --branch main
          python tools/browser_build/publish.py current --set "$prefix"
          if [ -n "$before" ] && [ "$before" != "$prefix" ]; then
            python tools/browser_build/publish.py prune --prefix "$before"
          fi

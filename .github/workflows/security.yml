name: security

# Fast checks on every push and pull request: known-vulnerable dependencies,
# committed secrets, and unsafe workflow patterns. Each job reads only; none
# installs the project. About a minute and a half of wall time, and free on a
# public repository. The weekly and monthly tiers live in the CI workflows.
#
#   lockfiles  uv.lock still matches pyproject.toml
#   osv        runtime Python deps (every shipped extra) and the desktop crates
#   npm-audit  production deps of every JS package, read from the lockfile
#   secrets    gitleaks over the commits this push or PR adds
#   zizmor     the workflows themselves (permissions, injection, pinning)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv lock --check

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install osv-scanner
        run: |
          curl -fsSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Runtime requirements, as shipped
        # What a user installs: no dev group, every extra, nothing editable.
        run: uv export --locked --no-dev --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/runtime.txt"
      - name: Scan
        run: |
          ./osv-scanner scan source --config .github/osv-scanner.toml \
            -L "requirements.txt:$RUNNER_TEMP/runtime.txt" \
            -L desktop/src-tauri/Cargo.lock

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        root: [plexora/client, backend, desktop, website]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production dependencies, from the lockfile alone
        working-directory: ${{ matrix.root }}
        run: npm audit --omit=dev --audit-level=high --package-lock-only

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner \
            --log-opts="$RANGE" .

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --persona regular --min-severity medium --config .github/zizmor.yml .github/workflows

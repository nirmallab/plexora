name: Release
on:
  push:
    tags:
      - "*"
jobs:
  # One job, one platform: the wheel is pure Python, so there is nothing
  # per-OS to build. Plexora used to ship frozen desktop executables from a
  # macOS/Windows matrix; distribution is now pip-only.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # No node step: the wheel ships the client bundle committed under
      # plexora/client/dist/, so `npm run build` is a local step before the
      # tag rather than part of the release.
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

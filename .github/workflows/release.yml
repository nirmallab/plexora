name: Release

# Every artifact of one Plexora version: the wheel and sdist, and a desktop
# installer per platform. `python scripts/release.py ci --bump patch` pushes the
# tag that starts this and downloads what it produces; a manual run (no tag)
# builds dev-named installers without publishing anything.
#
# Signing turns on when its secrets exist -- see scripts/release.py's SIGNING
# block and DEPLOYMENT.md. Until then the same jobs produce unsigned builds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_LINK_MODE: copy
  # Mapped on every job and simply empty until the secrets are created.
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
  PLEXORA_WIN_SIGN_COMMAND: ${{ secrets.PLEXORA_WIN_SIGN_COMMAND }}
  PLEXORA_WIN_CERT_THUMBPRINT: ${{ secrets.PLEXORA_WIN_CERT_THUMBPRINT }}

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - id: version
        name: Version agrees everywhere, and with the tag
        run: |
          python scripts/release.py propagate --check
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match pyproject version $version" >&2
            exit 1
          fi
      # The client bundle is committed; CI verifies it rather than rebuilding.
      - run: python scripts/release.py client --verify-only
      - run: python scripts/release.py --build-dir build wheel
      - name: Tests
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv -e ".[dev,spatial]"
          .venv/bin/python -m pytest -q -p no:randomly -x --ignore=tests/test_desktop_process.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: build/dist/*

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 xvfb
      - name: Python runtime cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/plexora-release/pbs
          key: pbs-${{ matrix.target }}-${{ hashFiles('scripts/release.py') }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: build/dist
      - name: Toolchain
        run: python scripts/release.py --build-dir build --target ${{ matrix.target }} doctor --ci
      - name: Build, collect and validate
        shell: bash
        run: |
          mode=--dev
          [[ "$GITHUB_REF" == refs/tags/v* ]] && mode=--release
          python scripts/release.py $mode --build-dir build --release-dir release \
            --target ${{ matrix.target }} --skip-tests --skip-client --skip-wheel --yes all
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Flatten and checksum
        run: |
          mkdir -p out
          find collected -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          python scripts/release.py checksums out
      - uses: softprops/action-gh-release@v2
        with:
          name: Plexora ${{ needs.preflight.outputs.version }}
          files: out/*

name: Release

# Every artifact of one Plexora version: the wheel and sdist, a desktop
# installer per platform, and the website (its Python bundle on the assets
# bucket, its shell on Cloudflare Pages: the `web` and `web_deploy` jobs,
# docs/internal/WEBSITE_RELEASE.md). `python scripts/release.py ci --bump
# patch` pushes the tag that starts this and downloads what it produces; a
# manual run (no tag) builds dev-named installers and the website's bundle
# and shell without publishing anything.
#
# A tag builds only once a full-suite run (weekly.yml or monthly.yml) has
# passed on its commit; the preflight checks, and `scripts/release.py ci`
# starts that run and waits for it before pushing the tag. The preflight used
# to run the whole suite itself, 28-47 minutes, and re-ran it on every retry.
#
# Signing turns on when its secrets exist -- see scripts/release.py's SIGNING
# block and DEPLOYMENT.md. Until then the same jobs produce unsigned builds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LINK_MODE: copy

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The gate asks which full-suite runs passed on this commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # A signed release reads nothing another run could have written.
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - id: version
        name: Version agrees everywhere, and with the tag
        run: |
          python scripts/release.py propagate --check
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match pyproject version $version" >&2
            exit 1
          fi
      # The client bundle is committed; CI verifies it rather than rebuilding.
      - run: python scripts/release.py client --verify-only
      - run: python scripts/release.py --build-dir build wheel
      - name: A full suite passed on this commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in weekly.yml monthly.yml; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w "$workflow" -c "$GITHUB_SHA" -s success -L 1 \
                  --json databaseId -q '.[0].databaseId')
            if [ -n "$run" ]; then
              echo "Gate: $workflow run $run passed on $GITHUB_SHA."
              exit 0
            fi
          done
          echo "::error::No successful weekly.yml or monthly.yml run exists for $GITHUB_SHA. Run: gh workflow run weekly.yml --ref main (on this commit), wait for it to pass, then re-run this workflow."
          exit 1
      # One GET of /healthz: the Worker every build uploads to already
      # validates against this tag's vectors. `release.py ci` deploys it
      # before pushing the tag; this job holds no Cloudflare credentials.
      - name: The telemetry Worker knows this release's vectors
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release.py --skip-tests telemetry --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: build/dist/*
          retention-days: 7

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # No Intel macOS build: llvmlite (numba, via spatialdata) ships no
          # x86_64 macOS wheel since 0.46.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Only the build job sees the signing secrets -- not the preflight,
    # which builds the wheel from the tagged tree, and not the publish job.
    # Empty until the secrets are created.
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      PLEXORA_WIN_SIGN_COMMAND: ${{ secrets.PLEXORA_WIN_SIGN_COMMAND }}
      PLEXORA_WIN_CERT_THUMBPRINT: ${{ secrets.PLEXORA_WIN_CERT_THUMBPRINT }}
      # The in-app updater (Help > Check for Updates in the desktop app). The
      # private key signs each installer; the public key is a repository
      # variable, compiled into the app to check those signatures.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PLEXORA_UPDATER_PUBKEY: ${{ vars.PLEXORA_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # A signed release reads nothing another run could have written.
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Not for a tagged build: its compiled crates go into a signed
      # installer, and a cache is something another run could have written.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3  # zizmor: ignore[cache-poisoning] -- skipped for tags (the if above)
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 xvfb
      - name: Python runtime cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0  # zizmor: ignore[cache-poisoning] -- skipped for tags (the if above)
        with:
          path: ~/.cache/plexora-release/pbs
          key: pbs-${{ matrix.target }}-${{ hashFiles('scripts/release.py') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: build/dist
      - name: Toolchain
        run: python scripts/release.py --build-dir build --target ${{ matrix.target }} doctor --ci
      - name: Build, collect and validate
        shell: bash
        run: |
          mode=--dev
          [[ "$GITHUB_REF" == refs/tags/v* ]] && mode=--release
          python scripts/release.py $mode --build-dir build --release-dir release \
            --target ${{ matrix.target }} --skip-tests --skip-client --skip-wheel \
            --skip-telemetry --yes all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.app.tar.gz
            release/*/*.sig
          retention-days: 7

  # The website's half of a release (docs/internal/WEBSITE_RELEASE.md): its
  # Python bundle and its shell, built from the tagged tree beside the
  # installers, with no cache (as the installers: a release reads nothing
  # another run could have written). Nothing here holds a credential.
  web:
    name: Website bundle and shell
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - name: What the build runs
        env:
          UV_PYTHON: "3.13"
        run: |
          echo "PLEXORA_BENCH_HOME=$RUNNER_TEMP/plexora-web" >> "$GITHUB_ENV"
          echo "PLEXORA_DATA_PATH=$RUNNER_TEMP/plexora-data" >> "$GITHUB_ENV"
          uv sync --locked
          uv pip install --python .venv/bin/python pip "setuptools>=77" wheel
          uv python install 3.14
          echo "PLEXORA_PYTHON314=$(uv python find 3.14)" >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y -q brotli
          echo "PLEXORA_BROTLI=$(command -v brotli)" >> "$GITHUB_ENV"
      # plexora-kernels' Pyodide wheel for the base stage (as web.yml builds it;
      # build.py refuses a bundle without one, or one ported from other kernels).
      - name: plexora-kernels for the website (cibuildwheel --platform pyodide)
        run: |
          uvx --from cibuildwheel==4.3.5 cibuildwheel --platform pyodide --output-dir kernels/dist kernels
          echo "PLEXORA_KERNELS_WHEEL=$(ls kernels/dist/plexora_kernels-*-pyemscripten_*_wasm32.whl)" >> "$GITHUB_ENV"
      - name: The Python bundle (Pyodide's archive sha256-checked), into web/py/<version>/
        run: uv run --no-sync python tools/browser_build/build.py --out "$RUNNER_TEMP/web"
      - name: The shell, loading this version's bundle from the assets bucket
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          uv run --no-sync python -m plexora.client.static_build --out "$RUNNER_TEMP/web/static" \
            --py "https://assets.plexoraapp.com/py/$VERSION/"
      - name: Under every bar, and every part says this version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python tools/browser_build/budget.py --bundle "$RUNNER_TEMP/web/py/$VERSION" --site "$RUNNER_TEMP/web/static"
          tag=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag=(--tag "$GITHUB_REF"); fi
          python scripts/release.py propagate --check --bundle "$RUNNER_TEMP/web/py/$VERSION" \
            --site "$RUNNER_TEMP/web/static" "${tag[@]}"
      - name: The bundle boots in Node
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node tests/browser/import_check.mjs --bundle "$RUNNER_TEMP/web/py/$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release
          path: ${{ runner.temp }}/web
          compression-level: 1
          retention-days: 7

  # Once every installer built: the bundle to py/<version>/ on the assets
  # bucket (a released prefix is never rewritten; this same bundle found there
  # is a re-run, and passes), read back from https://assets.plexoraapp.com,
  # then the shell to the Pages project plexora-viewer, production branch
  # `release`. Before GA that is plexora-viewer.pages.dev; GA attaches
  # viewer.plexoraapp.com to the project (plan Phase 7).
  web_deploy:
    name: Website deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: website-production
    env:
      PLEXORA_WRANGLER: npx --yes wrangler@3.114.17
    steps:
      # Without the secrets the release goes on and the website stays where it
      # was, with a warning, unless the repository variable
      # PLEXORA_WEB_RELEASE is `required` (set it at GA).
      - id: gate
        name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUIRED: ${{ vars.PLEXORA_WEB_RELEASE }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRED" = "required" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set and PLEXORA_WEB_RELEASE is required."
            exit 1
          else
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set: this release does not reach the website (docs/internal/WEBSITE_RELEASE.md)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # publish.py is the standard library and wrangler; nothing of the
      # project's runs beside the token.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-release
          path: ${{ runner.temp }}/web
      # Fetched once, without the token in the environment, before the
      # uploads run it six at a time.
      - if: steps.gate.outputs.deploy == 'true'
        name: Wrangler
        run: $PLEXORA_WRANGLER --version
      - if: steps.gate.outputs.deploy == 'true'
        name: Bundle to py/<version>/, read back, shell to plexora-viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/web/py/$VERSION"
          python tools/browser_build/publish.py assets --bundle "$bundle" --prefix "py/$VERSION/"
          python tools/browser_build/publish.py verify --bundle "$bundle" \
            --base "https://assets.plexoraapp.com/py/$VERSION/"
          python tools/browser_build/publish.py site --dir "$RUNNER_TEMP/web/static" \
            --project plexora-viewer --branch release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build, web_deploy]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      # To start the docs build below.
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: collected
      - name: Flatten and checksum
        run: |
          mkdir -p out
          find collected -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.whl' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} out/ \;
          # What installed desktop apps read to find this release. Attached
          # to it, so `releases/latest/download/latest.json` always names the
          # newest one.
          python scripts/release.py manifest out --version ${{ needs.preflight.outputs.version }}
          python scripts/release.py checksums out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Plexora ${{ needs.preflight.outputs.version }}
          files: out/*
      # The docs site's download buttons read the latest release, so rebuild it
      # now. A release made with GITHUB_TOKEN starts no other workflow by
      # itself; a workflow_dispatch is the one event that token can start.
      - name: Rebuild the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"

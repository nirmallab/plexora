name: client

# The browser client (plexora/client/): the Karma suite, and the committed
# bundle matching a fresh build, on the pushes that change it. weekly.yml runs
# the same every Monday.

on:
  push:
    branches: [main]
    paths: ["plexora/client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["plexora/client/**", ".github/workflows/client.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plexora/client/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci --prefix plexora/client --no-audit --no-fund
      - name: The committed bundle is the build
        run: python scripts/release.py client --verify-only
      - name: Karma
        # karma.conf.js starts a windowed Chrome; the runner has no display.
        run: xvfb-run -a npm test --prefix plexora/client

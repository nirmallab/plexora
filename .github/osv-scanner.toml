# osv-scanner configuration for the security workflows.
#
# Every entry is a dependency Plexora cannot move on its own (it arrives with
# Tauri's Linux webview stack) and expires, so it is looked at again rather
# than forgotten. Add one only with a reason and an ignoreUntil.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-01-31
reason = "glib 0.18 via tauri's gtk-rs 0.18 chain (Linux webview only); fixed in glib 0.20, which needs Tauri to move to gtk-rs 0.20."

